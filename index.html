<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Procurar Paciente</title>
    <link rel="stylesheet" href="style.css">
    
</head>
<body>

    <div class="app">

        <!-- Header -->
        <header class="header">
            <h1>Procurar Paciente</h1>
        </header>

        <!-- Doctor Profile -->
        <section class="doctor">
            <div class="doctor-info">
                <p class="hospital">📍 Centro de<br>Medicina da USP</p>
                <h2>Dr. Pablo</h2>
            </div>

            <img
                src="image/doc.png"
                alt="Foto do Dr. Pablo"
                class="doctor-image"
            >
        </section>

        <!-- Patients -->
        <main class="patients">

            <h2 class="section-title">Outros Pacientes</h2>

            <!-- Patient 1 -->
            <article class="patient-card">
                <div class="patient-info">
                    <img
                        src="image/doc2.png"
                        alt="Valter da Silva"
                        class="patient-image"
                    >

                    <div class="patient-details">
                        <h3>Valter da Silva</h3>
                        <p class="age">70 anos</p>
                        <p class="registration">
                            <span class="star">★</span>
                            <span>Número de cadastro #5468883</span>
                        </p>
                    </div>
                </div>

                <button class="access-button">
                    Acessar Ficha Cadastral
                </button>
            </article>

            <!-- Patient 2 -->
            <article class="patient-card">
                <div class="patient-info">
                    <img
                        src="image/doc3.png"
                        alt="Jorge Souza"
                        class="patient-image"
                    >

                    <div class="patient-details">
                        <h3>Jorge Souza</h3>
                        <p class="age">70 anos</p>
                        <p class="registration">
                            <span class="star">★</span>
                            <span>Número de cadastro #5468883</span>
                        </p>
                    </div>
                </div>

                <button class="access-button">
                    Acessar Ficha Cadastral
                </button>
            </article>

            <!-- Patient 3 -->
            <article class="patient-card">
                <div class="patient-info">
                    <img
                        src="image/doc4.png"
                        alt="Gertrudes Golda"
                        class="patient-image"
                    >

                    <div class="patient-details">
                        <h3>Gertrudes Golda</h3>
                        <p class="age">82 anos</p>
                        <p class="registration">
                            <span class="star">★</span>
                            <span>Número de cadastro #5778284</span>
                        </p>
                    </div>
                </div>

                <button class="access-button">
                    Acessar Ficha Cadastral
                </button>
            </article>

        </main>

        <!-- Bottom Navigation Bar -->
        <nav class="bottom-nav">

            <a href="#" class="nav-item" aria-label="Início">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M3 10.5L12 3l9 7.5"></path>
                    <path d="M5.5 9.5V21h13V9.5"></path>
                    <path d="M9.5 21v-7h5v7"></path>
                </svg>
            </a>

            <a href="#" class="nav-item active" aria-label="Pacientes">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="12" cy="12" r="9"></circle>
                    <circle cx="12" cy="9" r="3"></circle>
                    <path d="M6.5 18c.8-3 2.7-4.5 5.5-4.5s4.7 1.5 5.5 4.5"></path>
                </svg>
            </a>

            <a href="#" class="nav-item" aria-label="Verificação">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <path d="M12 2.5l8 3v6c0 5-3.5 8.5-8 10-4.5-1.5-8-5-8-10v-6z"></path>
                    <path d="M8 12l2.5 2.5L16 9"></path>
                </svg>
            </a>

            <a href="#" class="nav-item" aria-label="Registros">
                <svg viewBox="0 0 24 24" aria-hidden="true">
                    <rect x="4" y="4" width="16" height="17" rx="1"></rect>
                    <path d="M8 2v4M16 2v4M4 9h16M8 13h8M8 17h8"></path>
                </svg>
            </a>

        </nav>

    </div>

</body>
</html>
